<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شركة الدرة - بزل تفاعلي</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #1a5c1a 0%, #0d3d0d 50%, #1a5c1a 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    overflow-x: hidden;
  }

  /* ===== HEADER ===== */
  .header {
    text-align: center;
    margin-bottom: 20px;
    animation: fadeDown 0.8s ease;
  }
  .brand-name {
    font-size: 2rem;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    letter-spacing: 2px;
  }
  .brand-name span { color: #f5c518; }
  .tagline { color: #a8d5a8; font-size: 0.95rem; margin-top: 4px; }

  /* ===== CARD ===== */
  .card {
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 24px;
    padding: 28px 24px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
    animation: fadeUp 0.8s ease;
  }

  /* ===== DIFFICULTY SELECTOR ===== */
  .section-title {
    color: #f5c518;
    font-size: 1rem;
    font-weight: 700;
    text-align: center;
    margin-bottom: 12px;
  }
  .diff-btns {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .diff-btn {
    flex: 1;
    padding: 10px 0;
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
  }
  .diff-btn:hover { background: rgba(245,197,24,0.2); border-color: #f5c518; }
  .diff-btn.active { background: #f5c518; color: #1a5c1a; border-color: #f5c518; box-shadow: 0 4px 15px rgba(245,197,24,0.4); }

  /* ===== STATS BAR ===== */
  .stats-bar {
    display: flex;
    justify-content: space-between;
    background: rgba(0,0,0,0.3);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 16px;
    color: #fff;
    font-size: 0.9rem;
  }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-label { color: #a8d5a8; font-size: 0.72rem; }
  .stat-value { font-weight: 700; color: #f5c518; font-size: 1rem; }

  /* ===== PUZZLE CONTAINER ===== */
  .puzzle-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 1.33;
    margin-bottom: 16px;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    touch-action: none;
  }
  .puzzle-grid {
    width: 100%;
    height: 100%;
    display: grid;
    gap: 2px;
    background: #0d3d0d;
  }

  /* ===== PUZZLE PIECES ===== */
  .piece {
    cursor: grab;
    border-radius: 6px;
    background-size: cover;
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    overflow: hidden;
  }
  .piece:active { cursor: grabbing; transform: scale(1.05); z-index: 10; box-shadow: 0 8px 20px rgba(0,0,0,0.6); }
  .piece.selected { outline: 3px solid #f5c518; transform: scale(1.05); z-index: 10; box-shadow: 0 8px 20px rgba(245,197,24,0.5); }
  .piece.correct { outline: 3px solid #4caf50; animation: correctPop 0.4s ease; }
  .piece.hint-flash { animation: hintFlash 0.6s ease; }

  /* ===== PREVIEW BUTTON ===== */
  .preview-btn {
    display: block;
    width: 100%;
    padding: 10px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 12px;
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.25s;
    margin-bottom: 12px;
  }
  .preview-btn:hover { background: rgba(255,255,255,0.2); }

  /* ===== ACTION BUTTONS ===== */
  .action-btns { display: flex; gap: 10px; }
  .btn-hint, .btn-restart {
    flex: 1;
    padding: 12px;
    border-radius: 14px;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.25s;
  }
  .btn-hint { background: rgba(245,197,24,0.2); color: #f5c518; border: 1px solid #f5c518; }
  .btn-hint:hover { background: rgba(245,197,24,0.35); }
  .btn-restart { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); }
  .btn-restart:hover { background: rgba(255,255,255,0.2); }

  /* ===== WIN OVERLAY ===== */
  .win-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 24px;
    animation: fadeIn 0.4s ease;
  }
  .win-overlay.show { display: flex; }
  .win-card {
    background: linear-gradient(135deg, #1a5c1a, #0d3d0d);
    border: 2px solid #f5c518;
    border-radius: 24px;
    padding: 32px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .win-trophy { font-size: 4rem; margin-bottom: 12px; animation: bounce 1s infinite; }
  .win-title { color: #f5c518; font-size: 1.6rem; font-weight: 900; margin-bottom: 8px; }
  .win-subtitle { color: #a8d5a8; font-size: 0.95rem; margin-bottom: 20px; }
  .win-stats { display: flex; gap: 12px; justify-content: center; margin-bottom: 24px; }
  .win-stat { background: rgba(255,255,255,0.08); border-radius: 12px; padding: 10px 16px; }
  .win-stat-val { color: #f5c518; font-size: 1.4rem; font-weight: 900; }
  .win-stat-lbl { color: #a8d5a8; font-size: 0.75rem; }
  .win-cta {
    background: #f5c518;
    color: #1a5c1a;
    border: none;
    border-radius: 14px;
    padding: 14px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    width: 100%;
    margin-bottom: 12px;
    transition: all 0.25s;
  }
  .win-cta:hover { background: #ffd700; transform: translateY(-2px); }
  .win-share {
    background: #25D366;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 12px 28px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    width: 100%;
    transition: all 0.25s;
  }
  .win-share:hover { background: #1ebe5a; }

  /* ===== IMAGE PREVIEW MODAL ===== */
  .preview-modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 900;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .preview-modal.show { display: flex; }
  .preview-modal img { max-width: 100%; max-height: 80vh; border-radius: 16px; border: 2px solid #f5c518; }
  .preview-close {
    position: absolute;
    top: 20px;
    left: 20px;
    background: #f5c518;
    color: #1a5c1a;
    border: none;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
    cursor: pointer;
    font-weight: 900;
  }

  /* ===== FOOTER ===== */
  .footer {
    margin-top: 20px;
    text-align: center;
    animation: fadeUp 1s ease;
  }
  .footer-brand {
    color: #a8d5a8;
    font-size: 0.82rem;
    margin-bottom: 6px;
  }
  .wa-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #25D366;
    color: #fff;
    text-decoration: none;
    border-radius: 50px;
    padding: 10px 20px;
    font-family: 'Cairo', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    box-shadow: 0 4px 15px rgba(37,211,102,0.4);
    transition: all 0.25s;
  }
  .wa-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,211,102,0.6); }
  .wa-icon { width: 22px; height: 22px; fill: #fff; }

  /* ===== CONFETTI ===== */
  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 2px;
    pointer-events: none;
    z-index: 2000;
    animation: confettiFall linear forwards;
  }

  /* ===== ANIMATIONS ===== */
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes correctPop { 0% { transform: scale(1); } 50% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes hintFlash { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
  }
</style>
</head>

// ===== STATE =====
let gridSize = 4;
let levelName = 'متوسط';
let pieces = [];
let selected = null;
let moves = 0;
let startTime = null;
let timerInterval = null;
let solved = 0;
let hintsLeft = 3;

// ===== INIT =====
function setDifficulty(size, name) {
  document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + size).classList.add('active');
  gridSize = size;
  levelName = name;
  document.getElementById('stat-level').textContent = name;
  initPuzzle();
}

function initPuzzle() {
  clearInterval(timerInterval);
  moves = 0;
  solved = 0;
  hintsLeft = 3;
  startTime = null;
  selected = null;
  document.getElementById('stat-moves').textContent = '0';
  document.getElementById('stat-time').textContent = '0:00';
  document.getElementById('stat-pct').textContent = '0%';
  buildPuzzle();
}

function buildPuzzle() {
  const total = gridSize * gridSize;
  const order = shuffleArray([...Array(total).keys()]);
  pieces = order.map((correctIdx, pos) => ({ pos, correctIdx }));

  const grid = document.getElementById('puzzle-grid');
  const wrap = document.getElementById('puzzle-wrap');
  grid.style.gridTemplateColumns = 'repeat(' + gridSize + ', 1fr)';
  grid.style.gridTemplateRows = 'repeat(' + gridSize + ', 1fr)';
  grid.innerHTML = '';

  const imgW = 4 / 3;
  const pW = 100 / gridSize;
  const pH = (100 / imgW) / gridSize;

  pieces.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = 'piece';
    div.dataset.pos = i;

    const col = p.correctIdx % gridSize;
    const row = Math.floor(p.correctIdx / gridSize);
    const bgX = -(col * pW * gridSize / gridSize);
    const bgY = -(row * pH * gridSize / gridSize);

    div.style.backgroundImage = 'url(' + IMAGE_SRC + ')';
    div.style.backgroundSize = (gridSize * 100) + '% ' + (gridSize * 100) + '%';
    div.style.backgroundPosition = (col * 100 / (gridSize - 1)) + '% ' + (row * 100 / (gridSize - 1)) + '%';

    div.addEventListener('click', () => clickPiece(i));
    div.addEventListener('touchstart', e => { e.preventDefault(); clickPiece(i); }, { passive: false });

    grid.appendChild(div);
  });

  checkAllCorrect();
}

function clickPiece(pos) {
  if (!startTime) {
    startTime = Date.now();
    timerInterval = setInterval(updateTimer, 1000);
  }

  const pieceEls = document.querySelectorAll('.piece');

  if (selected === null) {
    selected = pos;
    pieceEls[pos].classList.add('selected');
  } else if (selected === pos) {
    pieceEls[pos].classList.remove('selected');
    selected = null;
  } else {
    pieceEls[selected].classList.remove('selected');
    swapPieces(selected, pos);
    moves++;
    document.getElementById('stat-moves').textContent = moves;
    selected = null;
    checkAllCorrect();
  }
}

function swapPieces(a, b) {
  const tmp = pieces[a].correctIdx;
  pieces[a].correctIdx = pieces[b].correctIdx;
  pieces[b].correctIdx = tmp;

  const pieceEls = document.querySelectorAll('.piece');
  const gridSize_ = gridSize;

  [a, b].forEach(pos => {
    const el = pieceEls[pos];
    const ci = pieces[pos].correctIdx;
    const col = ci % gridSize_;
    const row = Math.floor(ci / gridSize_);
    el.style.backgroundPosition = (col * 100 / (gridSize_ - 1)) + '% ' + (row * 100 / (gridSize_ - 1)) + '%';
    el.classList.remove('correct');
    if (pieces[pos].correctIdx === pos) {
      el.classList.add('correct');
    }
  });
}

function checkAllCorrect() {
  const pieceEls = document.querySelectorAll('.piece');
  let correctCount = 0;
  pieces.forEach((p, i) => {
    if (p.correctIdx === i) {
      pieceEls[i].classList.add('correct');
      correctCount++;
    } else {
      pieceEls[i].classList.remove('correct');
    }
  });
  const total = gridSize * gridSize;
  const pct = Math.round(correctCount / total * 100);
  document.getElementById('stat-pct').textContent = pct + '%';

  if (correctCount === total && total > 0) {
    clearInterval(timerInterval);
    setTimeout(showWin, 600);
  }
}

function giveHint() {
  if (hintsLeft <= 0) { alert('انتهت التلميحات!'); return; }
  hintsLeft--;
  const pieceEls = document.querySelectorAll('.piece');
  const wrong = pieces.map((p, i) => p.correctIdx !== i ? i : -1).filter(i => i >= 0);
  if (wrong.length === 0) return;
  const r = wrong[Math.floor(Math.random() * wrong.length)];
  pieceEls[r].classList.add('hint-flash');
  setTimeout(() => pieceEls[r].classList.remove('hint-flash'), 700);
}

function updateTimer() {
  if (!startTime) return;
  const sec = Math.floor((Date.now() - startTime) / 1000);
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  document.getElementById('stat-time').textContent = m + ':' + String(s).padStart(2, '0');
}

function showWin() {
  document.getElementById('win-moves').textContent = moves;
  document.getElementById('win-time').textContent = document.getElementById('stat-time').textContent;
  document.getElementById('win-overlay').classList.add('show');
  launchConfetti();
}

function closeWin() {
  document.getElementById('win-overlay').classList.remove('show');
}

function showPreview() {
  document.getElementById('preview-img').src = IMAGE_SRC;
  document.getElementById('preview-modal').classList.add('show');
}

function closePreview() {
  document.getElementById('preview-modal').classList.remove('show');
}

function shareWA() {
  const t = 'أكملت بزل منتجات الدرة في ' + moves + ' حركة! 🧩🏆\nجرب أنت: ';
  window.open('https://wa.me/?text=' + encodeURIComponent(t), '_blank');
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function launchConfetti() {
  const colors = ['#f5c518','#fff','#4caf50','#ff5722','#2196f3'];
  for (let i = 0; i < 80; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.top = '-10px';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    c.style.animationDelay = Math.random() * 1 + 's';
    c.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 4000);
  }
}

// ===== START =====
window.onload = () => {
  document.getElementById('preview-img').src = IMAGE_SRC;
  initPuzzle();
};
